name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install . pyinstaller
      - run: pyinstaller --noconfirm --onefile --name ncm-pipeline ncm_pipeline/__main__.py
      - uses: actions/upload-artifact@v4
        with:
          name: ncm-pipeline-windows
          path: dist/ncm-pipeline.exe
      - name: attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ncm-pipeline.exe
